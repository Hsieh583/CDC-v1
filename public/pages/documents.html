<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理 - CDC 文件管制中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pages/dashboard.html">
                <i class="bi bi-file-earmark-check me-2"></i>CDC 文件管制中心
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/dashboard.html">
                            <i class="bi bi-speedometer2 me-1"></i>儀表板
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/pages/documents.html">
                            <i class="bi bi-files me-1"></i>文件管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/approvals.html">
                            <i class="bi bi-clipboard-check me-1"></i>簽核管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/admin.html" id="adminLink">
                            <i class="bi bi-gear me-1"></i>系統管理
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <span id="userInfo" class="me-3"></span>
                    <button class="btn btn-outline-light btn-sm" id="logoutBtn">
                        <i class="bi bi-box-arrow-right me-1"></i>登出
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容 -->
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="page-header">
                    <div class="container-fluid">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h1 class="page-title">
                                    <i class="bi bi-files me-2"></i>文件管理
                                </h1>
                                <p class="page-subtitle">查詢、搜尋與管理所有文件</p>
                            </div>
                            <div>
                                <a href="/pages/upload.html" class="btn btn-primary">
                                    <i class="bi bi-cloud-upload me-2"></i>上傳文件
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container-fluid">
            <div id="alerts"></div>

            <!-- 搜尋與篩選 -->
            <div class="card search-box">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">關鍵字搜尋</label>
                        <input type="text" class="form-control" id="searchKeyword" placeholder="搜尋文件標題或代碼...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">文件類別</label>
                        <select class="form-select" id="categoryFilter">
                            <option value="">全部類別</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">文件狀態</label>
                        <select class="form-select" id="statusFilter">
                            <option value="">全部狀態</option>
                            <option value="draft">草稿</option>
                            <option value="pending_review">待審核</option>
                            <option value="pending_approval">待核准</option>
                            <option value="approved">已核准</option>
                            <option value="rejected">已拒絕</option>
                            <option value="archived">已封存</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-primary w-100" id="searchBtn">
                            <i class="bi bi-search me-2"></i>搜尋
                        </button>
                    </div>
                </div>
            </div>

            <!-- 文件列表 -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-list-ul me-2"></i>文件列表</span>
                    <span id="resultCount" class="badge bg-primary"></span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>文件代碼</th>
                                    <th>標題</th>
                                    <th>類別</th>
                                    <th>版本</th>
                                    <th>狀態</th>
                                    <th>建立時間</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="documentsTable">
                                <tr>
                                    <td colspan="7" class="text-center">
                                        <div class="spinner-border text-primary my-3" role="status">
                                            <span class="visually-hidden">載入中...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 分頁 -->
            <div id="pagination" class="mt-3"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script>
        let currentPage = 1;
        let currentFilters = {};
        let categories = [];

        document.addEventListener('DOMContentLoaded', async () => {
            // 檢查使用者是否為管理員，若否則隱藏管理員連結
            const user = getCurrentUser();
            if (!user || user.role !== 'admin') {
                const adminLink = document.getElementById('adminLink');
                if (adminLink) adminLink.style.display = 'none';
            }

            // 載入類別以供篩選
            await loadCategories();

            // 載入文件
            await loadDocuments();

            // 設定事件監聽器
            document.getElementById('searchBtn').addEventListener('click', handleSearch);
            document.getElementById('searchKeyword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch();
            });
        });

        async function loadCategories() {
            try {
                const response = await AdminAPI.getCategories();
                categories = response.data || [];

                const select = document.getElementById('categoryFilter');
                categories.forEach(cat => {
                    if (cat.is_active) {
                        const option = document.createElement('option');
                        option.value = cat.id;
                        option.textContent = `${cat.code} - ${cat.name}`;
                        select.appendChild(option);
                    }
                });
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        async function loadDocuments(page = 1) {
            currentPage = page;

            try {
                let response;

                // 檢查是否有篩選條件
                if (Object.keys(currentFilters).length > 0) {
                    const params = { ...currentFilters, page, limit: 20 };
                    response = await DocumentsAPI.search(params);
                } else {
                    response = await DocumentsAPI.getAll(page, 20);
                }

                const documents = response.data || [];
                displayDocuments(documents);

                // 更新結果計數
                document.getElementById('resultCount').textContent = `${documents.length} 筆資料`;

            } catch (error) {
                console.error('Error loading documents:', error);
                document.getElementById('documentsTable').innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-danger p-4">
                            <i class="bi bi-exclamation-triangle me-2"></i>載入文件時發生錯誤
                        </td>
                    </tr>
                `;
            }
        }

        function displayDocuments(documents) {
            const tbody = document.getElementById('documentsTable');

            if (documents.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-muted p-4">
                            <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                            <p class="mt-2">沒有找到符合的文件</p>
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            documents.forEach(doc => {
                const category = categories.find(c => c.id === doc.category_id);
                const categoryName = category ? category.name : '-';

                html += `
                    <tr class="cursor-pointer" onclick="viewDocument(${doc.id})">
                        <td><span class="document-code">${doc.document_code}</span></td>
                        <td>${doc.title}</td>
                        <td>${categoryName}</td>
                        <td>${doc.current_version || 0}</td>
                        <td>${getStatusBadge(doc.status)}</td>
                        <td>${formatDateOnly(doc.created_at)}</td>
                        <td onclick="event.stopPropagation()">
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-primary" onclick="viewDocument(${doc.id})" title="檢視">
                                    <i class="bi bi-eye"></i>
                                </button>
                                ${doc.status === 'approved' ? `
                                    <button class="btn btn-outline-success" onclick="downloadDocument(${doc.id})" title="下載">
                                        <i class="bi bi-download"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function handleSearch() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            const categoryId = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;

            currentFilters = {};
            if (keyword) currentFilters.search = keyword;
            if (categoryId) currentFilters.category_id = categoryId;
            if (status) currentFilters.status = status;

            loadDocuments(1);
        }

        function viewDocument(id) {
            window.location.href = `/pages/document-detail.html?id=${id}`;
        }

        async function downloadDocument(id) {
            try {
                const blob = await DocumentsAPI.download(id);
                const response = await DocumentsAPI.getById(id);
                const doc = response.data.document;
                const filename = `${doc.document_code}_v${doc.current_version}.pdf`;

                await downloadFile(blob, filename);
                showToast('文件下載成功', 'success');
            } catch (error) {
                console.error('Error downloading document:', error);
                showToast('下載文件時發生錯誤', 'error');
            }
        }
    </script>
</body>

</html>
