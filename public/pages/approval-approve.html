<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核准文件 - CDC 文件管制中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pages/dashboard.html">
                <i class="bi bi-file-earmark-check me-2"></i>CDC 文件管制中心
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/dashboard.html">
                            <i class="bi bi-speedometer2 me-1"></i>儀表板
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/documents.html">
                            <i class="bi bi-files me-1"></i>文件管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/approvals.html">
                            <i class="bi bi-clipboard-check me-1"></i>簽核管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/admin.html" id="adminLink">
                            <i class="bi bi-gear me-1"></i>系統管理
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <span id="userInfo" class="me-3"></span>
                    <button class="btn btn-outline-light btn-sm" id="logoutBtn">
                        <i class="bi bi-box-arrow-right me-1"></i>登出
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容 -->
    <div class="container-fluid mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/pages/dashboard.html">首頁</a></li>
                <li class="breadcrumb-item"><a href="/pages/approvals.html">簽核管理</a></li>
                <li class="breadcrumb-item active">核准文件</li>
            </ol>
        </nav>

        <div id="alerts"></div>
        <div id="content">
            <div class="text-center p-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">載入中...</span>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script>
        let versionId;
        let versionData;

        document.addEventListener('DOMContentLoaded', async () => {
            // 檢查使用者是否為管理員，若否則隱藏管理員連結
            const user = getCurrentUser();
            if (!user || user.role !== 'admin') {
                const adminLink = document.getElementById('adminLink');
                if (adminLink) adminLink.style.display = 'none';
            }

            // 從 URL 取得版本 ID
            const urlParams = new URLSearchParams(window.location.search);
            versionId = urlParams.get('id');

            if (!versionId) {
                showError('版本 ID 不存在');
                return;
            }

            await loadVersionInfo();
        });

        async function loadVersionInfo() {
            try {
                // 載入版本與簽核歷史
                const historyResponse = await ApprovalsAPI.getHistory(versionId);
                const history = historyResponse.data || [];

                // 從待簽核項目中尋找版本資訊
                const pendingResponse = await ApprovalsAPI.getPending();
                const pending = pendingResponse.data || [];
                versionData = pending.find(p => p.version_id == versionId);

                if (!versionData) {
                    showError('找不到此版本資訊或您無權核准此文件');
                    return;
                }

                displayApprovalForm(versionData, history);
            } catch (error) {
                console.error('Error loading version info:', error);
                showError('載入版本資訊時發生錯誤：' + error.message);
            }
        }

        function displayApprovalForm(version, history) {
            const html = `
                <div class="row">
                    <div class="col-lg-8 mx-auto">
                        <!-- 版本資訊 -->
                        <div class="card mb-4">
                            <div class="card-header bg-success text-white">
                                <h5 class="mb-0"><i class="bi bi-file-text me-2"></i>文件核准 - Stage 3</h5>
                            </div>
                            <div class="card-body">
                                <table class="table table-borderless">
                                    <tr>
                                        <th width="25%">文件代碼：</th>
                                        <td><span class="document-code">${version.document_code}</span></td>
                                    </tr>
                                    <tr>
                                        <th>文件標題：</th>
                                        <td><strong>${version.title}</strong></td>
                                    </tr>
                                    <tr>
                                        <th>版本號：</th>
                                        <td>版本 ${version.version_number}</td>
                                    </tr>
                                    <tr>
                                        <th>目前狀態：</th>
                                        <td>${getStatusBadge(version.status)}</td>
                                    </tr>
                                    <tr>
                                        <th>提交時間：</th>
                                        <td>${formatDate(version.created_at)}</td>
                                    </tr>
                                </table>
                            </div>
                        </div>

                        <!-- 簽核歷史 -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="bi bi-clock-history me-2"></i>簽核記錄</h6>
                            </div>
                            <div class="card-body">
                                ${displayHistory(history)}
                            </div>
                        </div>

                        <!-- 核准表單 -->
                        <div class="card">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="bi bi-pencil-square me-2"></i>核准決定</h6>
                            </div>
                            <div class="card-body">
                                <div class="alert alert-info">
                                    <i class="bi bi-info-circle me-2"></i>
                                    此為最終核准階段，核准後文件將成為正式版本。
                                </div>
                                <form id="approvalForm">
                                    <div class="mb-3">
                                        <label class="form-label">核准動作 <span class="text-danger">*</span></label>
                                        <select class="form-select" id="approvalAction" required>
                                            <option value="">選擇核准動作...</option>
                                            <option value="approved">核准 - 發布為正式版</option>
                                            <option value="returned">退回 - 要求修改</option>
                                            <option value="rejected">拒絕 - 不予通過</option>
                                        </select>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label">核准意見 <span class="text-danger">*</span></label>
                                        <textarea class="form-control" id="approvalComments" rows="4" required placeholder="請輸入核准意見..."></textarea>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-success">
                                            <i class="bi bi-check-circle me-2"></i>提交核准
                                        </button>
                                        <a href="/pages/approvals.html" class="btn btn-secondary">
                                            <i class="bi bi-x-circle me-2"></i>取消
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;

            // 設定表單處理常式
            document.getElementById('approvalForm').addEventListener('submit', handleApproval);
        }

        function displayHistory(history) {
            if (history.length === 0) {
                return '<p class="text-muted">尚無簽核記錄</p>';
            }

            let html = '<div class="timeline">';
            history.forEach(record => {
                html += `
                    <div class="workflow-stage ${record.action === 'approved' ? 'completed' : ''}">
                        <div class="stage-number">${record.stage_number}</div>
                        <div class="flex-grow-1">
                            <div><strong>${record.approver_name || '未知'}</strong></div>
                            <div>${getActionBadge(record.action)}</div>
                            <div class="text-muted small mt-1">${record.comments || '-'}</div>
                            <div class="text-muted small">${formatDate(record.created_at)}</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        async function handleApproval(e) {
            e.preventDefault();

            const action = document.getElementById('approvalAction').value;
            const comments = document.getElementById('approvalComments').value;

            if (!action || !comments.trim()) {
                showToast('請填寫所有必填欄位', 'error');
                return;
            }

            let confirmMessage = `確定要${getActionText(action)}此文件嗎？`;
            if (action === 'approved') {
                confirmMessage += '\n核准後文件將成為正式版本。';
            }

            if (!confirmAction(confirmMessage)) {
                return;
            }

            try {
                await ApprovalsAPI.approve(versionId, action, comments);

                showToast(`文件${getActionText(action)}成功！`, 'success');
                setTimeout(() => {
                    window.location.href = '/pages/approvals.html';
                }, 1500);

            } catch (error) {
                console.error('Error submitting approval:', error);
                showToast('提交核准時發生錯誤：' + error.message, 'error');
            }
        }

        function getActionText(action) {
            const map = {
                'approved': '核准',
                'returned': '退回',
                'rejected': '拒絕'
            };
            return map[action] || action;
        }
    </script>
</body>

</html>
