<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件詳情 - CDC 文件管制中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pages/dashboard.html">
                <i class="bi bi-file-earmark-check me-2"></i>CDC 文件管制中心
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/dashboard.html">
                            <i class="bi bi-speedometer2 me-1"></i>儀表板
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/documents.html">
                            <i class="bi bi-files me-1"></i>文件管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/approvals.html">
                            <i class="bi bi-clipboard-check me-1"></i>簽核管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pages/admin.html" id="adminLink">
                            <i class="bi bi-gear me-1"></i>系統管理
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <span id="userInfo" class="me-3"></span>
                    <button class="btn btn-outline-light btn-sm" id="logoutBtn">
                        <i class="bi bi-box-arrow-right me-1"></i>登出
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid mt-4">
        <div class="container-fluid">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/pages/dashboard.html">首頁</a></li>
                    <li class="breadcrumb-item"><a href="/pages/documents.html">文件管理</a></li>
                    <li class="breadcrumb-item active">文件詳情</li>
                </ol>
            </nav>

            <div id="alerts"></div>
            <div id="content">
                <div class="text-center p-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">載入中...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script>
        let documentId;
        let documentData;

        document.addEventListener('DOMContentLoaded', async () => {
            // Check if user is admin and hide admin links if not
            const user = getCurrentUser();
            if (!user || user.role !== 'admin') {
                const adminLink = document.getElementById('adminLink');
                if (adminLink) adminLink.style.display = 'none';
            }

            // Get document ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            documentId = urlParams.get('id');

            if (!documentId) {
                showError('文件 ID 不存在');
                return;
            }

            await loadDocumentDetail();
        });

        async function loadDocumentDetail() {
            try {
                const response = await DocumentsAPI.getById(documentId);
                documentData = response.data;

                displayDocumentInfo(documentData.document);
                await displayVersions(documentData.document.id);
            } catch (error) {
                console.error('Error loading document:', error);
                showError('載入文件詳情時發生錯誤：' + error.message);
            }
        }

        function displayDocumentInfo(document) {
            const html = `
                <div class="row">
                    <div class="col-12">
                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0"><i class="bi bi-file-text me-2"></i>文件資訊</h5>
                                ${document.status === 'approved' ? `
                                    <button class="btn btn-success" onclick="downloadOfficialVersion()">
                                        <i class="bi bi-download me-2"></i>下載正式版
                                    </button>
                                ` : ''}
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <table class="table table-borderless">
                                            <tr>
                                                <th width="30%">文件代碼：</th>
                                                <td><span class="document-code">${document.document_code}</span></td>
                                            </tr>
                                            <tr>
                                                <th>文件標題：</th>
                                                <td><strong>${document.title}</strong></td>
                                            </tr>
                                            <tr>
                                                <th>文件描述：</th>
                                                <td>${document.description || '-'}</td>
                                            </tr>
                                        </table>
                                    </div>
                                    <div class="col-md-6">
                                        <table class="table table-borderless">
                                            <tr>
                                                <th width="30%">目前版本：</th>
                                                <td>${document.current_version || 0}</td>
                                            </tr>
                                            <tr>
                                                <th>文件狀態：</th>
                                                <td>${getStatusBadge(document.status)}</td>
                                            </tr>
                                            <tr>
                                                <th>建立時間：</th>
                                                <td>${formatDate(document.created_at)}</td>
                                            </tr>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>版本歷史</h5>
                            </div>
                            <div class="card-body" id="versionsContainer">
                                <div class="text-center p-4">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">載入中...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        async function displayVersions(docId) {
            try {
                const response = await DocumentsAPI.getVersions(docId);
                const versions = response.data || [];

                const container = document.getElementById('versionsContainer');

                if (versions.length === 0) {
                    container.innerHTML = `
                        <div class="text-center text-muted p-4">
                            <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                            <p class="mt-2">尚無版本記錄</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                versions.forEach(version => {
                    const isOfficial = version.is_official === 1;
                    html += `
                        <div class="version-item ${isOfficial ? 'official' : ''} mb-3">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1">
                                    <h6>
                                        版本 ${version.version_number}
                                        ${isOfficial ? '<span class="badge bg-success ms-2">正式版</span>' : ''}
                                    </h6>
                                    <p class="mb-2">${version.title}</p>
                                    <p class="text-muted mb-2">${version.description || ''}</p>
                                    <small class="text-muted">
                                        <i class="bi bi-person me-1"></i>${version.author_name || '未知'}
                                        <i class="bi bi-clock ms-3 me-1"></i>${formatDate(version.created_at)}
                                    </small>
                                    <div class="mt-2">
                                        ${getStatusBadge(version.status)}
                                        <span class="ms-2 text-muted">階段 ${version.approval_stage}</span>
                                    </div>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-outline-primary" onclick="viewApprovalHistory(${version.id})">
                                        <i class="bi bi-list-check"></i> 簽核記錄
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading versions:', error);
                document.getElementById('versionsContainer').innerHTML = `
                    <div class="alert alert-danger">載入版本記錄時發生錯誤</div>
                `;
            }
        }

        async function downloadOfficialVersion() {
            try {
                const blob = await DocumentsAPI.download(documentId);
                const filename = `${documentData.document.document_code}_v${documentData.document.current_version}.pdf`;
                await downloadFile(blob, filename);
                showToast('文件下載成功', 'success');
            } catch (error) {
                console.error('Error downloading document:', error);
                showToast('下載文件時發生錯誤', 'error');
            }
        }

        async function viewApprovalHistory(versionId) {
            try {
                const response = await ApprovalsAPI.getHistory(versionId);
                const history = response.data || [];

                let html = '<div class="table-responsive"><table class="table table-sm">';
                html += '<thead><tr><th>階段</th><th>簽核人</th><th>動作</th><th>意見</th><th>時間</th></tr></thead><tbody>';

                if (history.length === 0) {
                    html += '<tr><td colspan="5" class="text-center text-muted">尚無簽核記錄</td></tr>';
                } else {
                    history.forEach(record => {
                        html += `
                            <tr>
                                <td>階段 ${record.stage_number}</td>
                                <td>${record.approver_name || '未知'}</td>
                                <td>${getActionBadge(record.action)}</td>
                                <td>${record.comments || '-'}</td>
                                <td>${formatDate(record.created_at)}</td>
                            </tr>
                        `;
                    });
                }

                html += '</tbody></table></div>';

                // Show in modal
                showModal('簽核記錄', html);
            } catch (error) {
                console.error('Error loading approval history:', error);
                showToast('載入簽核記錄時發生錯誤', 'error');
            }
        }

        function showModal(title, content) {
            const modalHtml = `
                <div class="modal fade" id="historyModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">${title}</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                ${content}
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Remove existing modal if any
            const existingModal = document.getElementById('historyModal');
            if (existingModal) existingModal.remove();

            // Add new modal
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('historyModal'));
            modal.show();

            // Remove modal from DOM after it's hidden
            document.getElementById('historyModal').addEventListener('hidden.bs.modal', function () {
                this.remove();
            });
        }
    </script>
</body>
</html>
